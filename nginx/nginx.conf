# AI 诊断平台反向代理：
#   /api/*  → 后端 FastAPI（SSE 流式对话，必须关缓冲 + 长读超时）
#   /      → 前端 Next.js
# 后续上域名时：certbot 签证书 + 加 listen 443 ssl 块（Day2 后半段）
server {
    listen 80;
    server_name _;

    # 文件上传（对话附件）：与后端上传限制对齐
    client_max_body_size 20m;

    # ---------- 后端 API（含 SSE 流式对话） ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 三件套：关缓冲（事件立即下发）、连接保持、长超时
        # （方案生成 1-2 分钟 + 15s 心跳，300s 读超时兜底）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }

    # ---------- 前端页面 ----------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;      # Next.js HMR/dev 用，生产无副作用
        proxy_set_header Connection "upgrade";
    }
}
