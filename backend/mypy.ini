# W9 warmup: mypy config
# Strategy: no full enforcement yet -- strict only for app/agent/trace.py and
# app/config.py; other modules get a baseline list (docs/mypy_baseline.md),
# to be tightened gradually later. Does NOT block CI.

[mypy]
# 3.12: installed numpy stubs use PEP 695 `type` statements (3.12+)
python_version = 3.12
ignore_missing_imports = True
# third-party libs (langgraph / sentence_transformers / rapidocr...) have no stubs
follow_imports = silent
check_untyped_defs = False
warn_unused_configs = True

# ---------- strict whitelist ----------
[mypy-app.agent.trace]
strict = True

[mypy-app.config]
strict = True
