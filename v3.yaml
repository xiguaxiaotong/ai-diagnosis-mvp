      - generic [ref=e40]: 📋 方案完成：《校园外卖比价微信小程序》 【业务方案】这是一个帮全校约5000名同学省钱的微信小程序：打开就能看到同一份餐在美团、饿了么等平台的价格和评价，不用来回切换App比价，几秒钟找到最便宜的一家。对同学们是省时省钱，对你是校园里高频使用、容易口碑传播的实用工具。 【核心模块】平台餐品聚合、跨平台价格对比、餐品评价查看 【预算区间】55,000 - 92,000 元（明细 9 项，可解释报价构成） 【可行性】风险较高（风险高）—— 技术选型（微信原生小程序+Python+MySQL）本身轻量、匹配校园MVP规模，开发难度不大；但核心难点在数据采集：外卖平台无官方比价接口，依赖爬虫抓取公开数据，面临反爬、改版、法律合规三重不确定性，且评价数据版权风险高，技术方案未给出合规数据源替代方案。 【落地建议】 1. 先与用户确认是否接受缩减范围：仅保留P0比价核心功能，砍掉评价查看、跳转下单、后台管理，预算可压至3万左右，工期延至6周。 2. 立即验证数据源可行性：用一周时间试爬美团、饿了么公开页面，确认反爬强度与数据字段完整性，若无法稳定获取则改用人工录入+商家合作模式。 3. 合规前置：咨询律师或平台规则，确认展示公开价格与评价摘要是否侵权，必要时只展示价格、不展示评价原文，并标注来源。 4. 调整预算预期：向用户说明3万仅够极简MVP，若坚持全功能需追加至5万以上，或采用分期开发、先上线比价再迭代。
