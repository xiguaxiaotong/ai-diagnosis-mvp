services:
  backend:
    build: ./backend
    container_name: ai-diagnosis-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-diagnosis-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
