# AI 诊断平台 一键部署：
#   docker compose up -d --build
# 架构：Nginx(:80) → frontend(Next.js) + backend(FastAPI)
# 数据持久化：./backend/data（SQLite/上传文件/checkpoint）+ hf-cache（embedding 模型缓存）
# .env 与后端开发共用（项目根目录，含 DEEPSEEK_API_KEY）
services:
  backend:
    build: ./backend
    container_name: diag-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 同域反代下页面与 API 同源，CORS 白名单只是兜底
      - FRONTEND_ORIGIN=${PUBLIC_ORIGIN:-http://localhost}
      - HF_HOME=/data/hf-cache
    volumes:
      - ./backend/data:/app/data
      # bge-small embedding 模型缓存（约 100MB）：不挂载的话容器重建就要重新下载
      - ./hf-cache:/data/hf-cache
    expose:
      - "8000"
    # 容器 stdout 日志轮转：不配的话长跑日志无限涨撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      args:
        # 空串 = 同域 /api 反代（换 IP/域名无需重新构建）
        NEXT_PUBLIC_API_URL: ""
    container_name: diag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: diag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
