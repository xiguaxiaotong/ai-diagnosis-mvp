# =====================================================================
# AI 诊断平台 · 生产 compose（v2.0 上线预案包 · W10 Day3）
#
# 与根目录 docker-compose.yml（开发/演示用）的区别：
#   1. 镜像 tag 参数化（IMAGE_TAG）：发布带版本 tag，回滚 = 换 tag 一条命令
#   2. HTTPS：nginx 挂 TLS 证书 + 80 强跳 443（模板 nginx.prod.conf.template）
#   3. 持久化四路径显式挂载：sqlite / checkpoints / logs / backups
#   4. BASE_URL / FRONTEND_ORIGIN 自动指向 https://<备案域名>（邮件链接、CORS）
#
# ⚠️ 本文件所有相对路径基于 deploy/ 目录（compose v2 的 project directory
#    = compose 文件所在目录），从任何位置 -f 调用都不受影响。
#
# 标准用法（服务器 /home/ubuntu/ai-diagnosis 下）：
#   首次构建：
#     IMAGE_TAG=v2.0.0 DEPLOY_DOMAIN=你的域名 \
#       docker compose -f deploy/docker-compose.prod.yml up -d --build
#   后续发布（镜像已 build 过，只换 tag 起容器）：
#     IMAGE_TAG=v2.0.0 DEPLOY_DOMAIN=你的域名 \
#       docker compose -f deploy/docker-compose.prod.yml up -d
#   回滚（上一版 tag）：
#     IMAGE_TAG=v1.9.x DEPLOY_DOMAIN=你的域名 \
#       docker compose -f deploy/docker-compose.prod.yml up -d
# =====================================================================
services:
  backend:
    # 镜像 tag 参数化：build 时 compose 自动把产物打成这个 tag；
    # 回滚时换旧 tag 直接 up，不重新 build
    image: diag-backend:${IMAGE_TAG:-latest}
    build: ../backend
    container_name: diag-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      # 同域反代下页面与 API 同源，CORS 白名单只是兜底
      - FRONTEND_ORIGIN=https://${DEPLOY_DOMAIN:?必须提供备案域名（DEPLOY_DOMAIN）}
      # 邮件里的重置密码等链接前缀：必须 https+域名，否则邮件链接打不开
      - BASE_URL=https://${DEPLOY_DOMAIN:?}
      - HF_HOME=/data/hf-cache
    volumes:
      # ---- 持久化路径 1+2：sqlite 主库 + checkpoints（同在 data/ 下） ----
      # data/ 内还有 cases/（上传案例源文件）与 chroma/（向量库），一并持久化
      - ../backend/data:/app/data
      # ---- 持久化路径 3：trace + 运行日志 ----
      # TRACE_PATH 默认 /app/logs/trace.jsonl（W8 诊断轨迹，追加写）；
      # 不挂载容器重建即全丢——曾踩坑：trace 只存在于容器层，up --build 后消失
      - ../backend/logs:/app/logs
      # ---- 持久化路径 4：SQLite 备份产物 ----
      # backup_db.py 的输出目录（保留 14 份滚动）；与宿主机 crontab 配合
      - ../backend/backups:/app/backups
      # bge-small embedding 模型缓存（约 100MB）：不挂载容器重建要重新下载
      - ../hf-cache:/data/hf-cache
    expose:
      - "8000"
    # 健康检查：backend 启动含 alembic 迁移，给足 start_period；
    # 镜像是 python-slim 没有 curl，用标准库 urllib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 容器 stdout 日志轮转：不配的话长跑日志无限涨撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: diag-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      args:
        # 空串 = 同域 /api 反代（生产 Nginx 同源，换 IP/域名无需重新构建）
        # ⚠️ 当时踩过的坑：这个值必须是空串而不是 localhost:8000，
        #    否则浏览器直接跨域访问后端 8000，云上安全组不开放 = 全站瘫痪
        NEXT_PUBLIC_API_URL: ""
    container_name: diag-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: diag-nginx
    restart: unless-stopped
    environment:
      # nginx:alpine 的 templates 机制：容器启动自动 envsubst 模板里的 ${DOMAIN}
      - DOMAIN=${DEPLOY_DOMAIN:?必须提供备案域名（DEPLOY_DOMAIN）}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 生产模板（80 强跳 443 + SSE 关缓冲；替换变量见文件头注释）
      - ./nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # TLS 证书：腾讯云证书重命名为 fullchain.pem / privkey.pem 后放 deploy/certs/
      # （证书签发与挂载步骤见 docs/DEPLOY_RUNBOOK.md 第 5 步）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
