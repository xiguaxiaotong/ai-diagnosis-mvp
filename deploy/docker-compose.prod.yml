# =====================================================================
# AI 诊断平台 · 生产 compose（v2.0 上线预案包 · W10 Day3 / W11 D3 双模式）
#
# 与根目录 docker-compose.yml（开发/演示用）的区别：
#   1. 镜像 tag 参数化（IMAGE_TAG）：发布带版本 tag，回滚 = 换 tag 一条命令
#   2. 两种模式（W11 Day3「备案前 IP 模式」，由 COMPOSE_PROFILES 切换）：
#      - IP 模式（备案没批，先用 IP 跑通全链路）：
#          COMPOSE_PROFILES=ip DEPLOY_DOMAIN=134.175.137.41 \
#            IMAGE_TAG=v2.0-rc docker compose -f deploy/docker-compose.prod.yml up -d
#        → nginx-ip 只听 80（无 ssl/无强跳/无 certs 卷/无 443 映射），
#          FRONTEND_ORIGIN/BASE_URL = http://134.175.137.41
#      - 域名模式（备案通过后）：
#          COMPOSE_PROFILES=prod DEPLOY_DOMAIN=你的域名 DEPLOY_SCHEME=https \
#            IMAGE_TAG=v2.0.0 docker compose -f deploy/docker-compose.prod.yml up -d
#        → nginx 80 强跳 443 + TLS（模板 nginx.prod.conf.template + deploy/certs/）
#   3. 持久化四路径显式挂载：sqlite / checkpoints / logs / backups
#   4. deploy_v2.sh 会根据 DOMAIN 是 IP 还是域名自动选模式，不用手记
#
# ⚠️ 本文件所有相对路径基于 deploy/ 目录（compose v2 的 project directory
#    = compose 文件所在目录），从任何位置 -f 调用都不受影响。
#
# 回滚：IMAGE_TAG=<旧 tag> + 同样的 COMPOSE_PROFILES 再 up -d，不重 build。
# =====================================================================
services:
  backend:
    # 镜像 tag 参数化：build 时 compose 自动把产物打成这个 tag；
    # 回滚时换旧 tag 直接 up，不重新 build
    image: diag-backend:${IMAGE_TAG:-latest}
    build: ../backend
    container_name: diag-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      # 同域反代下页面与 API 同源，CORS 白名单只是兜底。
      # IP 模式（DEPLOY_SCHEME 默认 http）：http://134.175.137.41
      # 域名模式：DEPLOY_SCHEME=https → https://域名
      - FRONTEND_ORIGIN=${DEPLOY_SCHEME:-http}://${DEPLOY_DOMAIN:-134.175.137.41}
      # 邮件里的重置密码等链接前缀：与 FRONTEND_ORIGIN 同源同 scheme
      - BASE_URL=${DEPLOY_SCHEME:-http}://${DEPLOY_DOMAIN:-134.175.137.41}
      - HF_HOME=/data/hf-cache
    volumes:
      # ---- 持久化路径 1+2：sqlite 主库 + checkpoints（同在 data/ 下） ----
      # data/ 内还有 cases/（上传案例源文件）与 chroma/（向量库），一并持久化
      - ../backend/data:/app/data
      # ---- 持久化路径 3：trace + 运行日志 ----
      # TRACE_PATH 默认 /app/logs/trace.jsonl（W8 诊断轨迹，追加写）；
      # 不挂载容器重建即全丢——曾踩坑：trace 只存在于容器层，up --build 后消失
      - ../backend/logs:/app/logs
      # ---- 持久化路径 4：SQLite 备份产物 ----
      # backup_db.py 的输出目录（保留 14 份滚动）；与宿主机 crontab 配合
      - ../backend/backups:/app/backups
      # bge-small embedding 模型缓存（约 100MB）：不挂载容器重建要重新下载
      - ../hf-cache:/data/hf-cache
    expose:
      - "8000"
    # 健康检查：backend 启动含 alembic 迁移，给足 start_period；
    # 镜像是 python-slim 没有 curl，用标准库 urllib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 容器 stdout 日志轮转：不配的话长跑日志无限涨撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: diag-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      args:
        # 空串 = 同域 /api 反代（生产 Nginx 同源，换 IP/域名无需重新构建）
        # ⚠️ 当时踩过的坑：这个值必须是空串而不是 localhost:8000，
        #    否则浏览器直接跨域访问后端 8000，云上安全组不开放 = 全站瘫痪
        NEXT_PUBLIC_API_URL: ""
    container_name: diag-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- IP 模式 nginx（备案前；COMPOSE_PROFILES=ip 时启用） ----------
  # 与域名模式 nginx 互斥（不同 profile，永不同时跑，container_name 不冲突）。
  # 只 80、无 ssl/强跳/certs 卷/443 映射——见 nginx.ip.conf.template 头注释。
  nginx-ip:
    image: nginx:alpine
    container_name: diag-nginx
    restart: unless-stopped
    profiles: [ip]
    environment:
      - DOMAIN=${DEPLOY_DOMAIN:-134.175.137.41}
    ports:
      - "80:80"
    volumes:
      - ./nginx.ip.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 域名模式 nginx（备案通过后；COMPOSE_PROFILES=prod 时启用） ----------
  nginx:
    image: nginx:alpine
    container_name: diag-nginx
    restart: unless-stopped
    profiles: [prod]
    environment:
      # nginx:alpine 的 templates 机制：容器启动自动 envsubst 模板里的 ${DOMAIN}
      - DOMAIN=${DEPLOY_DOMAIN:-134.175.137.41}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 生产模板（80 强跳 443 + SSE 关缓冲；替换变量见文件头注释）
      - ./nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      # TLS 证书：腾讯云证书重命名为 fullchain.pem / privkey.pem 后放 deploy/certs/
      # （证书签发与挂载步骤见 docs/DEPLOY_RUNBOOK.md 第 5 步）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
